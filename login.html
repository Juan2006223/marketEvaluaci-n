    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            background-image: url('https://images.unsplash.com/photo-1554356391-8bbd5018add1?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;

            pointer-events: none;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(37, 99, 235, 0.1);
        }

        .input-modern {
            @apply w-full px-4 py-3 bg-white/60 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition-all;
        }

        .input-modern:focus {
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-modern {
            @apply w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg text-sm font-medium transition-all shadow-sm hover:shadow-md;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .illustration {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            position: relative;
            overflow: hidden;
        }

        .illustration::before {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -100px;
            right: -100px;
        }

        .illustration::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            bottom: -80px;
            left: -80px;
        }

        .social-btn {
            @apply w-10 h-10 rounded-full bg-white/10 backdrop-blur-sm flex items-center justify-center text-white hover:bg-white/20 transition-all cursor-pointer;
        }

        .link-text {
            @apply text-blue-600 hover:text-blue-700 text-sm font-medium cursor-pointer transition-colors;
        }

        .logo-container {
            filter: brightness(0) invert(1);
        }
    </style>
</head>

                <div class="mb-8 text-center">
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">Iniciar sesión</h1>
                    <p class="text-gray-500 text-sm">Desbloquea tu mundo.</p>
                </div>

                <form id="login-form" class="space-y-6">
                    <div class="relative">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Correo institucional</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-blue-600">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M16 12H8m0 0l4-4m-4 4l4 4" />
                                </svg>
                            </span>
                            <input id="email" type="email" required
                                class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg text-sm text-gray-800 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white transition-all duration-200"
                                placeholder="nombre@upn.edu.co">
                        </div>
                    </div>

                    <div class="relative">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-blue-600">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 11c0-1.1.9-2 2-2s2 .9 2 2v2m-8 4h8v-4m0 0V9a2 2 0 00-2-2h-4a2 2 0 00-2 2v4z" />
                                </svg>
                            </span>
                            <input id="password" type="password" required
                                class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg text-sm text-gray-800 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white transition-all duration-200"
                                placeholder="••••••••">
                        </div>
                    </div>

                    <div class="flex items-center justify-between text-sm">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox"
                                class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <span class="text-gray-600">Recordarme</span>
                        </label>
                        <a href="#" class="link-text">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="w-full flex items-center justify-center gap-2 px-6 py-3 rounded-lg 
         bg-gradient-to-r from-blue-600 to-blue-700 text-white font-semibold 
         shadow-md hover:shadow-lg focus:outline-none focus:ring-2 
         focus:ring-blue-500 focus:ring-offset-2 transition-all duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

  <script>
document.getElementById("login-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("password").value.trim();

  // 🧩 Usuarios predefinidos
  const adminUser = { email: "admin@upn.edu.co", password: "admin123", role: "admin" };
  const demoUser  = { email: "demo@upn.edu.co", password: "12345", role: "user" };

  let userSession = null;

  // 🧠 Validación de credenciales
  if (email === adminUser.email && pass === adminUser.password) {
    userSession = { loggedIn: true, name: "Administrador", email, role: "admin" };
  } 
  else if (email === demoUser.email && pass === demoUser.password) {
    userSession = { loggedIn: true, name: "Usuario Demo", email, role: "user" };
  } 
  else if (email.endsWith("@upn.edu.co")) {
    userSession = { loggedIn: true, name: email.split("@")[0], email, role: "user" };
  }

  // ✅ Inicio de sesión exitoso
  if (userSession) {
    localStorage.setItem("user", JSON.stringify(userSession));

    Swal.fire({
      icon: "success",
      title: `¡Bienvenido ${userSession.role === "admin" ? "Administrador" : "Usuario"}!`,
      text: "Redirigiendo...",
      showConfirmButton: false,
      timer: 1500,
      customClass: { popup: "rounded-xl" }
    });

    setTimeout(() => {
      // 🔁 Redirección según rol
      if (userSession.role === "admin") {
        window.location.href = "admin.html";
      } else {
        window.location.href = "index_tres_copy.html";
      }
    }, 1500);
  } 
  else {
    // ⚠️ Credenciales incorrectas
    Swal.fire({
      icon: "error",
      title: "Credenciales incorrectas",
      text: "Verifica tu correo y contraseña",
      confirmButtonColor: "#2563eb",
      customClass: { popup: "rounded-xl" }
    });
  }
});
</script>
